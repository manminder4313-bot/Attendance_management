<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin Account - MRSPTU</title>
    <style>
        :root {
            --primary: #0b3c7d;
            --secondary: #1e6bd6;
            --white: #ffffff;
            --bg-light: #f5f7fb;
            --success: #2ecc71;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .register-container {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 5px rgba(30, 107, 214, 0.2);
        }

        .btn {
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            background: var(--success);
        }

        .btn:hover {
            background: #27ae60;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            display: none;
            background: #e6fffa;
            color: var(--success);
        }

        .links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .links a {
            color: var(--secondary);
            text-decoration: none;
        }

        .support-info {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="register-container">
        <h1>Setup Admin Account</h1>
        <div id="regMsg" class="message"></div>
        <form id="registerForm">
            <div class="form-group">
                <label>New Admin ID</label>
                <input type="text" id="regId" placeholder="Create Username" required>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="regPwd" placeholder="Create Password" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label>Contact Number</label>
                <input type="tel" id="regContact" placeholder="+91 XXX-XXX-XXXX" required>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="links">
            Already have an account? <a href="../FRONTEND/Login.html">Login here</a>
        </div>

        <div class="support-info">
            Maharaja Ranjit Singh Punjab Technical University, Bathinda<br>
            Technical Support: info@mrsptu.ac.in | +91-1644-239205
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const msg = document.getElementById('regMsg');

            const newAdmin = {
                id: document.getElementById('regId').value,
                password: document.getElementById('regPwd').value,
                email: document.getElementById('regEmail').value,
                contact: document.getElementById('regContact').value
            };

            // Save to localStorage (shared across folders on same origin)
            localStorage.setItem('adminCredentials', JSON.stringify(newAdmin));

            msg.textContent = 'Admin account created successfully! Redirecting to login...';
            msg.style.display = 'block';

            setTimeout(() => {
                window.location.href = '../FRONTEND/Login.html';
            }, 2000);
        });
    </script>

</body>

</html>
