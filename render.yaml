services:
  # Backend Web Service
  - type: web
    name: attendance-backend
    env: node
    plan: free
    rootDir: UNIVERSITY_ATTENDANCE/BACKEND
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false # User will need to provide this in Render dashboard
      - key: PORT
        value: 5000

  # Frontend Static Site
  - type: static
    name: attendance-frontend
    env: static
    plan: free
    rootDir: UNIVERSITY_ATTENDANCE/react-frontend
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
