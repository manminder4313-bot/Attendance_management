services:
  - type: web
    name: attendance-system
    env: node
    plan: free
    rootDir: UNIVERSITY_ATTENDANCE
    buildCommand: |
      cd BACKEND && npm install
      cd ../react-frontend && npm install && npm run build
      cp -r dist ../BACKEND/dist
    startCommand: cd BACKEND && npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 20
