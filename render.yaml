services:
  - type: web
    name: attendance-system
    env: node
    plan: free
    rootDir: UNIVERSITY_ATTENDANCE/BACKEND
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false # User will need to provide this in Render dashboard
      - key: PORT
        value: 5000
      - key: NODE_VERSION
        value: 20
